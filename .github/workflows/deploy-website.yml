name: Deploy website

# A push to main publishes somul.app. A pull request publishes a preview under its own branch
# URL instead, so a change can be looked at before it is the live site. Both are the same
# project; only the --branch argument decides which one a deployment becomes.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Failing here beats failing after a full build with a message about an argument nobody
      # passed. The token and account id are repository secrets; without them wrangler-action
      # authenticates as nobody and the deploy step is the one that says so.
      - name: Require the Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set as repository" >&2
            echo "secrets. The token needs Cloudflare Pages: Edit on the account that owns the" >&2
            echo "somul project." >&2
            exit 1
          fi

      - run: npm ci

      - name: Verify
        run: npm run verify

      # next.config.ts reads the version out of src-tauri/tauri.conf.json, so the checkout has to
      # carry the app as well as the site. It does; this is only here to say why.
      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy out --project-name=somul --branch=${{ github.head_ref || 'main' }}
