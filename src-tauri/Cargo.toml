[package]
name = "somul"
version = "1.0.0"
description = "Tray-first cross-platform per-application audio mixer"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "somul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", default-features = false, features = ["audio_toolbox", "core_audio"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
